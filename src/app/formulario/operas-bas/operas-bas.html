<<div class="col-6">
    <div class="mb-3">
        <form action="">
            <div class="form-group pt-4">
                <label for="num1">Numero 1:</label>
                <!-- Juntamos el ngModel con las clases de estilo en un solo input -->
                <input type="text" [(ngModel)]="num1" name="num1" class="form-control" id="num1" placeholder="Ingresa numero 1">
            </div>
            <div class="form-group pt-4">
                <label for="num2" class="form-label">Numero 2:</label>
                
                <input type="text" [(ngModel)]="num2" name="num2" class="form-control" id="num2" placeholder="Ingresa numero 2">
            </div>
            <br>
            
            <!-- Grupo de Radio Botones -->
            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="operacion" value="sumar" [(ngModel)]="operacion">
                    <label class="form-check-label">Sumar</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="operacion" value="restar" [(ngModel)]="operacion">
                    <label class="form-check-label">Restar</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="operacion" value="multiplicar" [(ngModel)]="operacion">
                    <label class="form-check-label">Multiplicar</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="operacion" value="dividir" [(ngModel)]="operacion">
                    <label class="form-check-label">Dividir</label>
                </div>
            </div>

            <button (click)="calcular()" type="button" class="btn btn-success mb-3">
                Calcular
            </button>

            <!--<button (click)="sumar()" type="button" class="btn btn-primary">
                Sumar
            </button>
            <button (click)="restar()" type="button" class="btn btn-primary">
                restar
            </button>
            <button (click)="multiplicar()" type="button" class="btn btn-primary">
                multiplicar
            </button>
            <button (click)="dividir()" type="button" class="btn btn-primary">
                dividir
            </button>-->
        </form>
    </div>
</div>
<div class="col-6">
    <h2>Resultado: {{resultado}}</h2>
</div>
